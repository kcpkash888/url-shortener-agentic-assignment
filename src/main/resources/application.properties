spring.application.name=urlshortener-agentic
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:sqlite:${URLSHORT_DB_PATH:urlshortener.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite serializes writes at the file level; capping the pool at 1 connection
# avoids "database is locked" errors under concurrent requests instead of
# fighting SQLite's locking model with a bigger pool. Same trade-off as the
# Python port's single shared connection, expressed via Hikari config instead
# of hand-rolled connection management.
spring.datasource.hikari.maximum-pool-size=1

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

urlshort.base-host=${URLSHORT_BASE_HOST:http://localhost:8080}
urlshort.code-length=${URLSHORT_CODE_LENGTH:7}
urlshort.cache-ttl-seconds=${URLSHORT_CACHE_TTL_SECONDS:30}
urlshort.cache-max-size=${URLSHORT_CACHE_MAX_SIZE:10000}
urlshort.rate-limit-requests=${URLSHORT_RATE_LIMIT_REQUESTS:60}
urlshort.rate-limit-window-seconds=${URLSHORT_RATE_LIMIT_WINDOW_SECONDS:60}

logging.level.com.example.urlshortener=INFO

# Matches the Python port's snake_case JSON field names (code, target_url,
# custom_alias, ...) so the two implementations are API-compatible.
spring.jackson.property-naming-strategy=SNAKE_CASE
