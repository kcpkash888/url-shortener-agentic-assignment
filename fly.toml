app = "url-shortener-agentic-demo"
primary_region = "iad"

[build]

[env]
  URLSHORT_BASE_HOST = "https://url-shortener-agentic-demo.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
